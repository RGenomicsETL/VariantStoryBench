name: R CMD check

"on":
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions: read-all

jobs:
  R-CMD-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: r-lib/actions/setup-pandoc@v2
      - uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true
      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          extra-packages: >-
            any::roxygen2,
            any::tinytest,
            any::targets,
            any::knitr,
            any::rmarkdown,
            local::.
          needs: check
      - name: Check package
        run: make check
      - name: Run benchmark pipeline
        run: make targets
