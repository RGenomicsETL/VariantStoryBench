name: Implementation and rendered guide
on:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  focused-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true
      - uses: quarto-dev/quarto-actions/setup@v2
      - name: Install focused test and render dependencies
        shell: Rscript {0}
        run: install.packages(c("DBI", "duckdb", "glue", "tinytest", "knitr", "rmarkdown"))
      - name: Run implementation tests
        run: Rscript tools/test-implementation.R
      - name: Render guides
        run: |
          for source in docs/*.qmd; do
            quarto render "$source" --to gfm
            quarto render "$source" --to html
          done
      - uses: actions/upload-artifact@v4
        with:
          name: implementation-guide
          path: |
            docs/*.md
            docs/*.html
          if-no-files-found: error
